[package]
name = "shangkeya"
version = "1.0.0"
description = "上课鸭 - 教师端"
authors = ["shangkeya"]
edition = "2021"

[lib]
name = "shangkeya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.9"
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
] }
