<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>pixel test 5</title>
<style>
  body { margin: 0; background: #000; }
  #ta {
    position: absolute; left: 20px; top: 40px; width: 860px; height: 140px;
    padding: 0; border: 0; margin: 0;
    font: 72px 'Microsoft YaHei', 'Segoe UI', sans-serif;
    line-height: 1.15; background: #111;
    color: #ff0000; resize: none; overflow: hidden;
  }
  #cv { position: absolute; left: 20px; top: 40px; width: 860px; height: 140px; background: transparent; z-index: 5; }
  #guide { position: absolute; left: 20px; top: 40px; width: 860px; height: 1px; background: #00ff00; }
</style>
</head>
<body>
  <textarea id="ta" spellcheck="false">人口</textarea>
  <div id="guide"></div>
  <canvas id="cv" width="860" height="140"></canvas>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const txt = '人口';
ctx.font = "72px 'Microsoft YaHei', 'Segoe UI', sans-serif';
ctx.textBaseline = 'alphabetic';
// 模拟产品：baseline = 偏移点(3px) + 0.958em
ctx.fillStyle = '#00d0ff';
ctx.fillText(txt, 3, 3 + 72 * 0.958);
</script>
</body>
</html>
